# SWRD: download manually from the Google Drive folder linked in
# https://github.com/bit628/RapidX-Annotator and unpack to raw_dir.
# Run `uv run weldsight-prepare --config configs/experiment/swrd_baseline.yaml --inspect`
# first and fix label_map if label names differ (e.g. Chinese labels).
data:
  name: swrd_v1
  source: swrd
  url: https://github.com/bit628/RapidX-Annotator
  license: "Not stated; maintainers ask to cite Zhao et al. 2025 and contact them before redistribution/commercial use"
  citation: "Zhao et al. SWRD: A Dataset of Radiographic Image of Seam Weld for Defect Detection. J. Nondestruct. Eval. 44 (2025)."
  raw_dir: data/raw/swrd
  processed_dir: data/processed/swrd_v1
  class_names: [porosity, inclusion, crack, undercut, lack_of_fusion, lack_of_penetration]
  source_opts:
    # Use only crop_weld_data (weld-bead strips cut from Raw_data films; A_/B_ = two strips of
    # one film). Never mix with Raw_data: the same film would land in two splits.
    # Group by shooting date: a day holds up to ~200 films, overlapping exposures of one weld
    # show the same defect twice. 75 dates + 21 BAM RRT films (same series as RIAWELC).
    group_regex: "^(?:[AB]_)?(?:DJ-RT-(?:T-)?)?(\\d{8}|RRT-\\d+R)"
    label_map:                # labels checked on the archive (notebooks/swrd_peek.py)
      气孔: porosity
      夹渣: inclusion
      裂纹: crack
      咬边: undercut
      未熔合: lack_of_fusion
      未焊透: lack_of_penetration
      # not in class_names -> not drawn (background):
      焊缝: _weld_seam         # bead region outline, useful later as a paste mask (stage 2)
      伪缺陷: _pseudo_defect    # look-alike artefacts marked as NOT a defect
      夹钨: _tungsten_inclusion # bright (dense) inclusion, very rare; not merged with slag
      焊瘤: _overlap            # weld overlap, ~1 per 150 files
  deduplicate: true
  patch_size: 256
  stride: {train: 128, val: 256, test: 256}   # overlap only inside train
  bg_keep_ratio: {train: 0.3, val: 1.0, test: 1.0}
  min_defect_pixels: 10
  split:
    fractions: [0.7, 0.15, 0.15]
    seed: 0
    n_trials: 5000
