# SWRD: download manually from the Google Drive folder linked in
# https://github.com/bit628/RapidX-Annotator and unpack to raw_dir.
# Run `uv run weldsight-prepare --config configs/experiment/swrd_baseline.yaml --inspect`
# first and fix label_map if label names differ (e.g. Chinese labels).
data:
  name: swrd_v1
  source: swrd
  url: https://github.com/bit628/RapidX-Annotator
  license: "Not stated; maintainers ask to cite Zhao et al. 2025 and contact them before redistribution/commercial use"
  citation: "Zhao et al. SWRD: A Dataset of Radiographic Image of Seam Weld for Defect Detection. J. Nondestruct. Eval. 44 (2025)."
  raw_dir: data/raw/swrd
  processed_dir: data/processed/swrd_v1
  class_names: [porosity, inclusion, crack, undercut, lack_of_fusion, lack_of_penetration]
  source_opts:
    # SWXD_Data.zip: crop_weld_data/crop_weld_images/{L,T}/{1,2}/{A,B}_DJ-RT-<YYYYMMDD>-<n>.tif
    # (A/B = two weld crops of one film; Raw_data/ holds the same films uncropped).
    # Group = film date: the A/B halves of a film, and films shot on the same day
    # (likely the same weld job), always land in the same split.
    group_regex: "^(?:[AB]_)?(.+?)(?:-\\d+)?$"
    label_map:                # labels checked on SWXD_Data.zip (2026-10-19)
      气孔: porosity
      夹渣: inclusion
      夹钨: inclusion         # tungsten inclusion, ~0.3 % of defect shapes in a 300-file sample, too rare for its own class
      裂纹: crack
      咬边: undercut
      未熔合: lack_of_fusion
      未焊透: lack_of_penetration
    ignore_labels: [焊缝, 伪缺陷]  # weld bead region, pseudo-defect: not defects -> background
  deduplicate: true
  patch_size: 256
  stride: {train: 128, val: 256, test: 256}   # overlap only inside train
  bg_keep_ratio: {train: 0.3, val: 1.0, test: 1.0}
  min_defect_pixels: 10
  split:
    fractions: [0.7, 0.15, 0.15]
    seed: 0
    n_trials: 5000
